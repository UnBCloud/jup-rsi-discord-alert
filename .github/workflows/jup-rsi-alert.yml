name: JUP RSI + BB Discord Monitor

on:
  schedule:
    # Run approximately every 5 minutes:
    # :02, :07, :12, :17, :22, etc. (UTC)
    - cron: "2-59/5 * * * *"

  # Allow manual testing from GitHub Actions
  workflow_dispatch:

# Allow the workflow to save alert_state.json
permissions:
  contents: write

# Prevent overlapping runs from conflicting
# when saving alert history
concurrency:
  group: jup-rsi-alert-state
  cancel-in-progress: false

jobs:
  monitor:
    name: monitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run JUP RSI monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 jup_rsi_monitor.py

      - name: Save alert history
        if: always()
        run: |
          if [ ! -f alert_state.json ]; then
            echo "No alert state to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add alert_state.json

          if git diff --cached --quiet; then
            echo "Alert state unchanged."
            exit 0
          fi

          git commit -m "Update JUP RSI alert state"
          git push origin HEAD:main
