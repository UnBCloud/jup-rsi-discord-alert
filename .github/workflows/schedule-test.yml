
name: Schedule Test

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm scheduled execution
        run: |
          echo "GitHub Actions scheduler test"
          echo "Event: ${{ github.event_name }}"
          echo "Current UTC time:"
          date -u
