
name: Verify Jupiter 1H Indicators

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-jup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Jupiter candle data
        run: python3 verify_jup_data.py
